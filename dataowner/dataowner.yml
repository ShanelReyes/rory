services:
  rory-dataowner-0:
    image: rory:dataowner
    container_name: rory-dataowner-0
    hostname: rory-dataowner-0
    env_file:
      - .env
    ports:
      - 3000:3000
    volumes:
      - /rory/rory-dataowner-0/source:/rory/source
      - /rory/rory-dataowner-0/sink:/rory/sink
      - /rory/rory-dataowner-0/log:/rory/log
      - /rory/rory-dataowner-0/mictlanx:/rory/mictlanx
      - /rory/rory-dataowner-0/keys:/rory/keys
    networks:
      - mictlanx

networks:
  mictlanx: 
    external: true
