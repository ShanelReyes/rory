name: Publish Shared Packages to TestPyPI

on:
  push:
    tags:
      - 'rory-v*'
      - 'roryclient-v*'
      - 'rorycommon-v*'

jobs:
  publish:
    name: Publish ${{ steps.parse.outputs.package }} to TestPyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse tag
        id: parse
        run: |
          TAG="${{ github.ref_name }}"
          PACKAGE=$(echo "$TAG" | sed -E 's/-v[0-9].*$//')
          VERSION=$(echo "$TAG" | sed -E 's/^.*-v//')
          echo "package=$PACKAGE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Map package to directory
        id: dir
        run: |
          case "${{ steps.parse.outputs.package }}" in
            rory)       echo "name=rorycore" >> $GITHUB_OUTPUT ;;
            roryclient) echo "name=roryclient" >> $GITHUB_OUTPUT ;;
            rorycommon) echo "name=rorycommon" >> $GITHUB_OUTPUT ;;
            *)          echo "name=${{ steps.parse.outputs.package }}" >> $GITHUB_OUTPUT ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure TestPyPI repository
        run: |
          cd "shared/${{ steps.dir.outputs.name }}"
          poetry config repositories.testpypi https://test.pypi.org/legacy/

      - name: Bump version
        run: |
          cd "shared/${{ steps.dir.outputs.name }}"
          poetry version "${{ steps.parse.outputs.version }}"

      - name: Build package
        run: |
          cd "shared/${{ steps.dir.outputs.name }}"
          poetry build

      - name: Publish to TestPyPI
        env:
          POETRY_PYPI_TOKEN_TESTPYPI: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          cd "shared/${{ steps.dir.outputs.name }}"
          poetry publish -r testpypi --username __token__ --password "$POETRY_PYPI_TOKEN_TESTPYPI"

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.parse.outputs.package }}-${{ steps.parse.outputs.version }}
          path: shared/${{ steps.dir.outputs.name }}/dist/
